name: Myntra integration tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_myntra_schemas.py tests/test_myntra_models.py tests/test_myntra_ingestion.py tests/test_myntra_rate_limit.py -q
      - working-directory: extension
        run: npm test
