services:
  - type: web
    name: polytaste-backend
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polytaste-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://polytaste-frontend.onrender.com,chrome-extension://ehicjjjefimefanmlleacjhdmbfnobel

  - type: web
    name: polytaste-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: polytaste-db
    databaseName: polytaste
    user: polytaste
    plan: free
